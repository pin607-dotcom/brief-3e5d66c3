  app.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");
   if(h.startsWith("#"))a.addEventListener("click",e=>{e.preventDefault();go(h.slice(1))});
   else if(h.startsWith(BASE+"/")){const i=h.indexOf("#");a.setAttribute("href",(i<0?h:h.slice(0,i))+"#k="+k+(i<0?"":"&s="+h.slice(i+1)))}});
  if(q.get("s"))go(q.get("s"));
 }catch(e){app.innerHTML='<p class="meta">내용을 열 수 없습니다. 카카오톡 카드의 링크로 다시 열어 주세요.</p>'}
})();
</script></body></html>
